<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <!-- Warm terracotta-coral swatch -->
    <linearGradient id="coral" x1="40" y1="40" x2="170" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EB6B4D"/>
      <stop offset="100%" stop-color="#C94132"/>
    </linearGradient>
    <!-- Warm marigold-gold swatch -->
    <linearGradient id="gold" x1="80" y1="36" x2="215" y2="205" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F6C453"/>
      <stop offset="100%" stop-color="#DF9426"/>
    </linearGradient>
    <!-- Deep editorial teal-emerald accent -->
    <linearGradient id="teal" x1="120" y1="60" x2="225" y2="215" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2A9D8F"/>
      <stop offset="100%" stop-color="#196E67"/>
    </linearGradient>
    <!-- Warm editorial parchment front card -->
    <linearGradient id="paper" x1="72" y1="48" x2="196" y2="218" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#F4ECE1"/>
    </linearGradient>
    <!-- Soft subtle elevation shadow for layered cards -->
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1A0F14" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Floating fanned Pantone / Brand Swatch Cards (all artwork within ~10% safe margin 26..230) -->
  <!-- Left back swatch: Terracotta Coral -->
  <g transform="rotate(-17 128 168)" filter="url(#cardShadow)">
    <rect x="64" y="46" width="96" height="156" rx="18" fill="url(#coral)" stroke="#F6A28D" stroke-opacity="0.45" stroke-width="2"/>
  </g>

  <!-- Right back swatch: Editorial Teal -->
  <g transform="rotate(17 128 168)" filter="url(#cardShadow)">
    <rect x="96" y="46" width="96" height="156" rx="18" fill="url(#teal)" stroke="#7ED6C9" stroke-opacity="0.45" stroke-width="2"/>
  </g>

  <!-- Center-right accent swatch: Marigold Gold -->
  <g transform="rotate(6 128 172)" filter="url(#cardShadow)">
    <rect x="82" y="42" width="100" height="162" rx="18" fill="url(#gold)" stroke="#FCE2A6" stroke-opacity="0.55" stroke-width="2"/>
  </g>

  <!-- Front hero swatch card: Warm Parchment with Brand Star Emblem & Color Chips -->
  <g transform="rotate(-4 128 168)" filter="url(#cardShadow)">
    <rect x="72" y="48" width="112" height="166" rx="20" fill="url(#paper)" stroke="#D8C9B8" stroke-width="2.5"/>

    <!-- Top brand color window inside card -->
    <rect x="86" y="62" width="84" height="90" rx="13" fill="#231920"/>

    <!-- Editorial 4-point craft star / logo spark inside dark studio window -->
    <path d="M128 76 C131 96, 136 101, 156 107 C136 113, 131 118, 128 138 C125 118, 120 113, 100 107 C120 101, 125 96, 128 76 Z"
          fill="#F6C453"/>
    <!-- Precision center cutout dot -->
    <circle cx="128" cy="107" r="6.5" fill="#231920"/>
    <!-- Accent micro-sparkle -->
    <circle cx="151" cy="84" r="4" fill="#EB6B4D"/>

    <!-- Bottom Pantone swatch footer: palette dots + typographic spec lines -->
    <circle cx="96" cy="174" r="6.5" fill="#D94E3B"/>
    <circle cx="114" cy="174" r="6.5" fill="#E8A534"/>
    <circle cx="132" cy="174" r="6.5" fill="#23887C"/>
    <rect x="90" y="191" width="52" height="6.5" rx="3.25" fill="#231920"/>
    <rect x="148" y="191" width="18" height="6.5" rx="3.25" fill="#A69689"/>
  </g>
</svg>
