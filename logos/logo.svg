<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <linearGradient id="bg" x1="26" y1="26" x2="230" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="wave" x1="68" y1="74" x2="188" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="55%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="border" x1="26" y1="26" x2="230" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- Outer squircle (~10% transparent safe margin on all sides: 26..230) -->
  <rect x="26" y="26" width="204" height="204" rx="44" fill="url(#bg)" stroke="url(#border)" stroke-width="3.5"/>

  <!-- Precision corner ticks -->
  <path d="M56 48 H48 V56 M200 48 H208 V56 M56 208 H48 V200 M200 208 H208 V200"
        stroke="#475569" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Top Tidalto crest: stylized wave-cap crossbar of "T" -->
  <path d="M68 92 C88 74, 114 74, 134 86 C152 96, 170 96, 188 80"
        stroke="url(#wave)" stroke-width="15" stroke-linecap="round"/>

  <!-- Central vertical stem of "T" -->
  <rect x="119" y="102" width="18" height="84" rx="6" fill="#F8FAFC"/>

  <!-- Modular plugin blocks docked symmetrically on left & right of stem -->
  <rect x="74" y="122" width="30" height="26" rx="7" fill="#1E293B" stroke="#94A3B8" stroke-width="4.5"/>
  <rect x="74" y="160" width="30" height="26" rx="7" fill="#1E293B" stroke="#38BDF8" stroke-width="4.5"/>

  <rect x="152" y="122" width="30" height="26" rx="7" fill="#1E293B" stroke="#38BDF8" stroke-width="4.5"/>
  <rect x="152" y="160" width="30" height="26" rx="7" fill="#1E293B" stroke="#34D399" stroke-width="4.5"/>
</svg>
