<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <linearGradient id="bg" x1="26" y1="26" x2="230" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="94" y1="120" x2="180" y2="136" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="border" x1="26" y1="26" x2="230" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="55%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- Outer engineering squircle (~10% transparent safe margin on all sides: 26..230) -->
  <rect x="26" y="26" width="204" height="204" rx="44" fill="url(#bg)" stroke="url(#border)" stroke-width="3.5"/>

  <!-- Precision blueprint corner ticks -->
  <path d="M56 48 H48 V56 M200 48 H208 V56 M56 208 H48 V200 M200 208 H208 V200"
        stroke="#475569" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Optically centered architectural mark: spine + 3 gated specification layers ("E") -->
  <g transform="translate(-2.5, 0)">
    <!-- Vertical structural spine -->
    <rect x="74" y="76" width="16" height="104" rx="5" fill="#F8FAFC"/>

    <!-- Top bar: Architecture / Skeleton -->
    <rect x="98" y="76" width="84" height="16" rx="5" fill="#F8FAFC"/>

    <!-- Middle bar: Research & Decision Gate -->
    <rect x="98" y="120" width="54" height="16" rx="5" fill="url(#accent)"/>
    <circle cx="174" cy="128" r="10" fill="#0B1220" stroke="#38BDF8" stroke-width="4.5"/>

    <!-- Bottom bar: Verified Milestone / Audit Gate -->
    <rect x="98" y="164" width="60" height="16" rx="5" fill="#F8FAFC"/>
    <path d="M167 172 L174 179 L187 165"
          stroke="#34D399" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
